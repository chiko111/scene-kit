name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write       # version commit + tags
  pull-requests: write  # "Version Packages" PR
  id-token: write       # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No registry-url and no NPM_TOKEN: npm authenticates with GitHub's OIDC token
      # (trusted publishing). Nothing to rotate, nothing that expires.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # With pending changesets → opens/updates the "Version Packages" PR.
      # When that PR is merged → builds and publishes to npm (provenance is automatic).
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
