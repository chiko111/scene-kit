name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run --workspaces

  spring-boot-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        boot: ['4.1.1', '3.5.16']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Spring Boot ${{ matrix.boot }}
        working-directory: examples/spring-boot
        run: |
          sed -i "0,/<version>4.1.1<\/version>/s//<version>${{ matrix.boot }}<\/version>/" pom.xml
          mvn -B -q test
